# Virtual file system root (matches core default; override per environment if needed)
server.port=8082

# Session 安全基线。生产 HTTPS 环境应设置 SESSION_COOKIE_SECURE=true。
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# 数据库连接密码使用 AES-256-GCM 加密；生产环境建议通过环境变量提供固定主密钥。
leo.database.secrets.master-key=${LEO_DATABASE_MASTER_KEY:}
leo.database.secrets.key-file=${LEO_DATABASE_KEY_FILE:.leo/database-secrets.key}

# 前后端分离开发时允许携带 Session Cookie 的明确来源；生产同源访问无需配置。
leo.web.cors.allowed-origins=${LEO_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# 响应压缩(对大型日志查询/聚合响应可省 80%+ 带宽)
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/html,text/plain,text/css,text/xml
server.compression.min-response-size=1024

spring.datasource.url=jdbc:sqlite:data.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.username=
spring.datasource.password=

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.leo.model
mybatis.configuration.map-underscore-to-camel-case=true

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1


# The final schema must exist before AI/service beans query it during context creation.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql

# ── AI 配置 (LangChain4j + OpenAI 兼容) ──────────────────────────────
# Agent 含多轮工具调用，响应时间可能超过数分钟，禁用 Spring MVC 异步超时。
spring.mvc.async.request-timeout=-1

# 心跳、队列扫描和清理任务不共用单个调度线程，避免某个慢任务拖停执行租约续期。
spring.task.scheduling.pool.size=4

# 模型 API Key / 敏感 Headers 使用 AES-GCM 加密落盘。
# 生产环境建议设置 LEO_AI_MASTER_KEY；未设置时会生成本地 .leo/ai-secrets.key。
leo.ai.secrets.master-key=${LEO_AI_MASTER_KEY:}
leo.ai.secrets.key-file=${LEO_AI_KEY_FILE:.leo/ai-secrets.key}

# 模型可靠性：连续暂态失败达到阈值后，仅在下一轮请求切换到该模型配置的备用模型。
leo.ai.failover.failure-threshold=${LEO_AI_FAILOVER_FAILURE_THRESHOLD:2}
leo.ai.failover.cooldown-seconds=${LEO_AI_FAILOVER_COOLDOWN_SECONDS:120}
# Agent 任务工作空间：按用户和 AI 任务隔离，位于用户文件空间 ai-tasks 目录。
leo.ai.workspace.quota-bytes=${LEO_AI_WORKSPACE_QUOTA_BYTES:268435456}
leo.ai.workspace.max-files=${LEO_AI_WORKSPACE_MAX_FILES:2000}
leo.ai.workspace.max-file-bytes=${LEO_AI_WORKSPACE_MAX_FILE_BYTES:67108864}
leo.ai.workspace.max-write-chars=${LEO_AI_WORKSPACE_MAX_WRITE_CHARS:262144}
leo.ai.workspace.max-read-chars=${LEO_AI_WORKSPACE_MAX_READ_CHARS:20000}
leo.ai.workspace.max-search-results=${LEO_AI_WORKSPACE_MAX_SEARCH_RESULTS:200}

# Agent 脚本只能在 Docker 沙箱运行；默认关闭，启用后仍然断网、限 CPU/内存/PID。
leo.ai.sandbox.enabled=${LEO_AI_SANDBOX_ENABLED:false}
leo.ai.sandbox.docker-command=${LEO_AI_SANDBOX_DOCKER_COMMAND:docker}
leo.ai.sandbox.python-image=${LEO_AI_SANDBOX_PYTHON_IMAGE:python:3.12-alpine}
leo.ai.sandbox.node-image=${LEO_AI_SANDBOX_NODE_IMAGE:node:22-alpine}
leo.ai.sandbox.java-image=${LEO_AI_SANDBOX_JAVA_IMAGE:eclipse-temurin:17-jdk-alpine}
leo.ai.sandbox.timeout-ms=${LEO_AI_SANDBOX_TIMEOUT_MS:120000}
leo.ai.sandbox.memory=${LEO_AI_SANDBOX_MEMORY:256m}
leo.ai.sandbox.cpus=${LEO_AI_SANDBOX_CPUS:1}
leo.ai.sandbox.pids-limit=${LEO_AI_SANDBOX_PIDS_LIMIT:64}
leo.ai.sandbox.max-log-bytes=${LEO_AI_SANDBOX_MAX_LOG_BYTES:2097152}

# 公网抓取默认可用；搜索需要 Brave Search API Key。所有外部正文都标记为未信任内容。
leo.ai.web-research.enabled=${LEO_AI_WEB_RESEARCH_ENABLED:true}
leo.ai.web-research.brave-api-key=${LEO_AI_WEB_SEARCH_API_KEY:}
leo.ai.web-research.brave-search-url=${LEO_AI_WEB_SEARCH_URL:https://api.search.brave.com/res/v1/web/search}
leo.ai.web-research.connect-timeout-ms=${LEO_AI_WEB_CONNECT_TIMEOUT_MS:10000}
leo.ai.web-research.request-timeout-ms=${LEO_AI_WEB_REQUEST_TIMEOUT_MS:20000}
leo.ai.web-research.max-fetch-bytes=${LEO_AI_WEB_MAX_FETCH_BYTES:2097152}
leo.ai.web-research.max-content-chars=${LEO_AI_WEB_MAX_CONTENT_CHARS:40000}
leo.ai.web-research.max-redirects=${LEO_AI_WEB_MAX_REDIRECTS:4}
